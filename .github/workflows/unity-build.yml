name: Build & Deploy

on:
  # Every push to master builds all platforms
  push:
    branches: [master]
  # Manual run: choose which platforms to build
  workflow_dispatch:
    inputs:
      build_webgl:
        description: 'Build WebGL (+ deploy to Pages / itch.io when run on master)'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows (StandaloneWindows64)'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux (StandaloneLinux64)'
        type: boolean
        default: true

# Needed for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel older builds
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  # UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
  # Personal license users: use this instead of UNITY_SERIAL
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  # ---------------------------------------------------------------- WebGL
  build-webgl:
    name: Build WebGL
    if: github.event_name == 'push' || inputs.build_webgl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          unityVersion: auto
          # buildName / buildsPath defaults -> build/WebGL/WebGL

      - uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL
          retention-days: 7

      # Package exactly what Pages should serve (index.html at the root)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  # --------------------------------------------------------- Deploy Pages
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-webgl
    # Only deploy from master, not from manual runs on other branches
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------ Windows / Linux
  # Run on every push, or when ticked in a manual run.
  # (Two jobs instead of a matrix: `matrix` isn't available in a job-level `if`.)
  build-windows:
    name: Build Windows
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: auto
      - uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: build/StandaloneWindows64
          retention-days: 14

  build-linux:
    name: Build Linux
    if: github.event_name == 'push' || inputs.build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneLinux64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneLinux64-
            Library-
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: auto
      - uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneLinux64
          path: build/StandaloneLinux64
          retention-days: 14

  # ----------------------------------------------------------------- itch.io
  # Needs: BUTLER_API_KEY secret, ITCH_USER / ITCH_GAME repository variables.
  # Publishes whichever builds succeeded in this run (master only).
  publish-itch:
    name: Publish to itch.io
    needs: [build-webgl, build-windows, build-linux]
    if: >-
      !cancelled() && github.ref == 'refs/heads/master' &&
      (needs.build-webgl.result == 'success' ||
       needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    env:
      BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ vars.ITCH_USER }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
      VERSION: ${{ github.run_number }}
    steps:
      # ---- WebGL -> html5 channel
      - name: Download WebGL build
        if: needs.build-webgl.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: artifacts/webgl
      - name: Upload WebGL to itch.io
        if: needs.build-webgl.result == 'success'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          CHANNEL: html5
          PACKAGE: artifacts/webgl/WebGL

      # ---- Windows -> windows channel
      - name: Download Windows build
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: artifacts/windows
      - name: Upload Windows to itch.io
        if: needs.build-windows.result == 'success'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          CHANNEL: windows
          PACKAGE: artifacts/windows

      # ---- Linux -> linux channel
      - name: Download Linux build
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Build-StandaloneLinux64
          path: artifacts/linux
      - name: Restore executable bit (artifacts don't keep file modes)
        if: needs.build-linux.result == 'success'
        run: find artifacts/linux -maxdepth 1 -type f ! -name '*.*' -exec chmod +x {} +
      - name: Upload Linux to itch.io
        if: needs.build-linux.result == 'success'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          CHANNEL: linux
          PACKAGE: artifacts/linux
